<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#543322"/>
      <stop offset="100%" stop-color="#2D1A12"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D0A9"/>
      <stop offset="100%" stop-color="#D4A373"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3ECE2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#B87333" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Book Pages & Spine Group -->
  <g filter="url(#shadow)">
    <!-- Back Cover Accent -->
    <path d="M12 43.5 C12 43.5 19 41.5 32 44 C45 41.5 52 43.5 52 43.5 L52 46.5 C52 46.5 45 44.5 32 47 C19 44.5 12 46.5 12 46.5 Z" fill="url(#goldGrad)"/>

    <!-- Left Book Page -->
    <path d="M13 18 C20 16 28 17.5 32 20.5 L32 44 C28 41 20 39.5 13 41.5 Z" fill="url(#pageGrad)"/>

    <!-- Right Book Page -->
    <path d="M51 18 C44 16 36 17.5 32 20.5 L32 44 C36 41 44 39.5 51 41.5 Z" fill="url(#pageGrad)"/>

    <!-- Book Center Seam / Fold Line -->
    <line x1="32" y1="20.5" x2="32" y2="44" stroke="#7A492E" stroke-width="1.5"/>

    <!-- Page Line Details -->
    <path d="M18 24.5 C22 23.5 26 24 29 25.5" stroke="#B87333" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M18 29.5 C22 28.5 26 29 29 30.5" stroke="#B87333" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M18 34.5 C22 33.5 26 34 29 35.5" stroke="#B87333" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

    <path d="M46 24.5 C42 23.5 38 24 35 25.5" stroke="#B87333" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M46 29.5 C42 28.5 38 29 35 30.5" stroke="#B87333" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M46 34.5 C42 33.5 38 34 35 35.5" stroke="#B87333" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

    <!-- Bookmark Ribbon Hanging Down -->
    <path d="M30 18 L34 18 L34 31 L32 29 L30 31 Z" fill="#C58940"/>
  </g>
</svg>

